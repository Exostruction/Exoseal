name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
    env:
      # Datenbank-Tests (Einmal-Abruf, Race-Condition) brauchen eine echte Postgres
      TEST_POSTGRES: Host=localhost;Database=test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: backend/global.json }
      - run: dotnet test backend
      # Lizenz-Check der ausgelieferten NuGet-Pakete (inkl. transitiver). Test-Pakete werden nicht ausgeliefert und nicht geprüft.
      - run: |
          dotnet tool install --global nuget-license
          export PATH="$PATH:$HOME/.dotnet/tools"
          nuget-license -i backend/src/ExoSeal.Api/ExoSeal.Api.csproj -t -a "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;PostgreSQL"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: npm i -g corepack && corepack enable
      - working-directory: frontend
        run: |
          yarn install --immutable
          yarn lint
          yarn test
          yarn build
          # Lizenz-Check: nur AGPL-kompatible Lizenzen erlauben (Liste bei Bedarf erweitern)
          npx --yes license-checker-rseidelsohn --production --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;MPL-2.0;CC0-1.0;Python-2.0;CC-BY-4.0;Unlicense;LGPL-3.0-or-later" --excludePrivatePackages
  e2e:
    # Ganzer Ablauf im Browser gegen den echten Stack mit Mock-Login (siehe e2e/README.md)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev-idp.yml up -d --build --wait
      - working-directory: e2e
        run: |
          npm ci
          npm test
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev-idp.yml logs --tail=100
